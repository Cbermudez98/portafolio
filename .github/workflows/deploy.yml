name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress one finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Node 24 ships npm 11, the version that generated package-lock.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Project site lives at https://<user>.github.io/<repo>/
      - run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"

      # Serve index.html for unknown paths too
      - run: cp dist/backend-portfolio/browser/index.html dist/backend-portfolio/browser/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/backend-portfolio/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
